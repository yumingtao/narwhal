<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DSH Desktop — 恢复</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; background: #10151d; color: #edf2f7; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(520px, calc(100vw - 48px)); padding: 34px; border: 1px solid #2a3a4c; border-radius: 18px; background: #16202c; box-shadow: 0 24px 80px #0007; }
      .badge { color: #89d7ff; font-size: 12px; letter-spacing: .13em; text-transform: uppercase; }
      h1 { margin: 14px 0 10px; font-size: 28px; } p { color: #b4c3d1; line-height: 1.55; }
      .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; } button { border: 0; border-radius: 10px; padding: 11px 15px; background: #38bdf8; color: #071019; font-weight: 650; cursor: pointer; } button.secondary { background: #29394a; color: #e7edf4; } button:disabled { opacity: .55; cursor: wait; } #status { min-height: 1.5em; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">Local recovery</div>
      <h1>DSH Host 未能启动</h1>
      <p>桌面壳没有加载不可信页面。你可以重试本地 Host，或导出不含凭据的诊断信息。</p>
      <p id="status" role="status"></p>
      <div class="actions">
        <button id="retry">重试</button>
        <button id="diagnostics" class="secondary">导出诊断</button>
        <button id="quit" class="secondary">退出</button>
      </div>
    </main>
    <script type="module" src="./recovery.js"></script>
  </body>
</html>
