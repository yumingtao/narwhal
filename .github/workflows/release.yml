name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version (e.g. v0.1.0)'
        required: false

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Stage DSH runtime
        run: |
          export DSH_RUNTIME_SOURCE=$(node -p "require('./package.json').dshRuntime")
          echo "Using DSH runtime: $DSH_RUNTIME_SOURCE"
          pnpm run stage:runtime

      - name: Build .app (unsigned)
        run: |
          # identity=null → electron-builder skips signing entirely
          # (CI codesign --deep hits EMFILE on DSH runtime's 28k files)
          pnpm exec electron-builder --mac dir --arm64 --publish never

      - name: Manual ad-hoc codesign
        run: |
          ulimit -n 1048576
          APP=$(find release -name 'Narwhal.app' -maxdepth 3 | head -1)
          echo "App: $APP"

          # Deep codesign — shell codesign vs electron-builder's internal uses
          # different fd patterns and often works on macOS runners
          codesign --force --deep --sign - "$APP"
          echo "✅ codesign done"

          codesign -dv "$APP" 2>&1 | grep -E "(Identifier|Signature|Team)"
          codesign --verify --deep --strict "$APP" 2>&1 && echo "✅ verify OK"

      - name: Create ZIP (manual)
        run: |
          APP=$(find release -name 'Narwhal.app' -maxdepth 3 | head -1)
          cd "$(dirname "$APP")"
          zip -1 -r "../../release/Narwhal-${GITHUB_REF_NAME}-mac-arm64.zip" "Narwhal.app"
          cd "$GITHUB_WORKSPACE"
          ls -lh release/*.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: narwhal-mac-arm64
          path: release/*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: narwhal-mac-arm64
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
