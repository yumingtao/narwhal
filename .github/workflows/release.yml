name: Release

on:
  push:
    tags:
      - '0.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # pnpm version is read from the "packageManager" field in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer + main
        run: pnpm build

      - name: Stage DSH runtime
        run: |
          export DSH_RUNTIME_SOURCE=$(node -p "require('./package.json').dshRuntime")
          echo "Using DSH runtime: $DSH_RUNTIME_SOURCE"
          pnpm run stage:runtime

      - name: Build .app (dir-only, skip signing)
        run: |
          # identity=null → electron-builder skips signing.
          # Its internal codesign hits EMFILE on CI with DSH runtime's 28k files.
          # We sign separately with shell codesign below.
          pnpm exec electron-builder --mac dir --arm64 --publish never

      - name: Ad-hoc codesign (shell)
        run: |
          ulimit -n 1048576
          APP=$(find release -name 'Narwhal.app' -maxdepth 3 | head -1)
          echo "App: $APP"
          codesign --force --deep --sign - "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "(Identifier|Signature)"
          codesign --verify --deep --strict "$APP" && echo "✅ verify OK"

      - name: Create ZIP
        run: |
          APP=$(find release -name 'Narwhal.app' -maxdepth 3 | head -1)
          cd "$(dirname "$APP")"
          # -y: store symlinks as-is (don't follow) — pnpm node_modules is
          # all symlinks/hardlinks, following them bloats the ZIP 5x+.
          # macOS unzip + Finder both correctly restore symlinks.
          zip -9 -y -r "../../release/Narwhal-${GITHUB_REF_NAME}-mac-arm64.zip" "Narwhal.app"
          cd "$GITHUB_WORKSPACE"
          ls -lh release/*.zip

      - name: Create DMG
        run: |
          brew install create-dmg
          APP=$(find release -name 'Narwhal.app' -maxdepth 3 | head -1)
          cd "$(dirname "$APP")"
          create-dmg \
            --volname "Narwhal Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Narwhal.app" 100 190 \
            --hide-extension "Narwhal.app" \
            --app-drop-link 420 185 \
            --no-internet-enable \
            "${GITHUB_WORKSPACE}/release/Narwhal-${GITHUB_REF_NAME}-mac-arm64.dmg" \
            "Narwhal.app"
          cd "$GITHUB_WORKSPACE"
          ls -lh release/*.dmg

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.dmg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
