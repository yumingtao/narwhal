name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version (e.g. v0.1.0)'
        required: false

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Stage DSH runtime (npm mode)
        run: |
          export DSH_RUNTIME_SOURCE=$(node -p "require('./package.json').dshRuntime")
          echo "Using DSH runtime: $DSH_RUNTIME_SOURCE"
          pnpm run stage:runtime

      - name: Package + codesign (dir only, manual DMG/ZIP)
        run: |
          ulimit -n 524288
          echo "ulimit: $(ulimit -n)"

          # Step 1: electron-builder — dir only (no DMG/ZIP pack needed)
          pnpm exec electron-builder \
            --mac dir \
            --arm64 \
            --publish never

          APP=$(find release -name 'Narwhal.app' -maxdepth 3 | head -1)
          echo "Built: $APP"

          # Step 2: ad-hoc codesign (macOS 15 compatibility)
          echo "Ad-hoc codesigning..."
          codesign --force --deep --sign - "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "(Identifier|Signature)"

          # Step 3: ZIP (compression=0 for speed, GitHub will recompress anyway)
          echo "Creating ZIP..."
          cd "$(dirname "$APP")"
          zip -0 -r "../../release/Narwhal-${{ github.ref_name }}-mac-arm64.zip" "Narwhal.app"

          # Step 4: DMG via create-dmg (lightweight, avoids EMFILE)
          echo "Creating DMG..."
          brew install create-dmg 2>/dev/null || true
          create-dmg \
            --volname "Narwhal Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Narwhal.app" 100 190 \
            --hide-extension "Narwhal.app" \
            --app-drop-link 420 185 \
            "../../release/Narwhal-${{ github.ref_name }}-mac-arm64.dmg" \
            "Narwhal.app" \
            || echo "⚠️  DMG creation failed, will ship ZIP only"

          cd "$GITHUB_WORKSPACE"
          echo ""
          echo "=== Final artifacts ==="
          ls -lh release/*.zip release/*.dmg 2>/dev/null || ls -lh release/*.zip

      - name: Verify artifacts
        run: |
          echo "=== Artifacts ==="
          ls -lh release/
          DMG=$(find release -name '*.dmg' | head -1)
          ZIP=$(find release -name '*.zip' | head -1)
          if [ -z "$DMG" ]; then echo "ERROR: DMG not found"; exit 1; fi
          if [ -z "$ZIP" ]; then echo "ERROR: ZIP not found"; exit 1; fi
          DMG_SIZE=$(stat -f%z "$DMG" 2>/dev/null || stat -c%s "$DMG" 2>/dev/null || echo 0)
          ZIP_SIZE=$(stat -f%z "$ZIP" 2>/dev/null || stat -c%s "$ZIP" 2>/dev/null || echo 0)
          if [ "$DMG_SIZE" -lt 10000000 ]; then echo "ERROR: DMG too small ($DMG_SIZE bytes, expected >10MB)"; exit 1; fi
          if [ "$ZIP_SIZE" -lt 10000000 ]; then echo "ERROR: ZIP too small ($ZIP_SIZE bytes, expected >10MB)"; exit 1; fi
          echo "✅ DMG: $DMG ($DMG_SIZE bytes)"
          echo "✅ ZIP: $ZIP ($ZIP_SIZE bytes)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: narwhal-mac-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: narwhal-mac-arm64
          path: artifacts

      - name: Display structure
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
