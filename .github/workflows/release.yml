name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version (e.g. v0.1.0)'
        required: false

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Stage DSH runtime (npm mode)
        run: |
          export DSH_RUNTIME_SOURCE=$(node -p "require('./package.json').dshRuntime")
          echo "Using DSH runtime: $DSH_RUNTIME_SOURCE"
          pnpm run stage:runtime

      - name: Package (DMG + ZIP)
        run: |
          pnpm exec electron-builder \
            --mac dmg zip \
            --arm64 \
            --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: narwhal-mac-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: narwhal-mac-arm64
          path: artifacts

      - name: Display structure
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
