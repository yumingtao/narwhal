name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version (e.g. v0.1.0)'
        required: false

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Stage DSH runtime (npm mode)
        run: |
          export DSH_RUNTIME_SOURCE=$(node -p "require('./package.json').dshRuntime")
          echo "Using DSH runtime: $DSH_RUNTIME_SOURCE"
          pnpm run stage:runtime
          # Aggressive prune to avoid EMFILE on macOS runner:
          # DSH runtime pulls ~8k files from node_modules, most are dev-only
          echo "Pruning runtime node_modules..."
          cd runtime/dsh
          find node_modules -name '*.map' -delete 2>/dev/null
          find node_modules -name 'src' -type d -exec rm -rf {} + 2>/dev/null
          find node_modules -name '__tests__' -type d -exec rm -rf {} + 2>/dev/null
          find node_modules -name 'test' -type d -exec rm -rf {} + 2>/dev/null
          find node_modules -name 'tests' -type d -exec rm -rf {} + 2>/dev/null
          find node_modules -name 'example' -type d -exec rm -rf {} + 2>/dev/null
          find node_modules -name 'examples' -type d -exec rm -rf {} + 2>/dev/null
          find node_modules -name 'demo' -type d -exec rm -rf {} + 2>/dev/null
          find node_modules -name 'docs' -type d -exec rm -rf {} + 2>/dev/null
          find node_modules -name '*.d.ts' -delete 2>/dev/null  # TS type defs
          find node_modules -name '*.md' -delete 2>/dev/null     # README per package
          find node_modules -name 'LICENSE*' -delete 2>/dev/null
          cd ../..
          echo "Pruning done. File count:"
          find runtime/dsh/node_modules -type f 2>/dev/null | wc -l

      - name: Package (DMG + ZIP)
        run: |
          ulimit -n 524288
          echo "ulimit: $(ulimit -n)"
          pnpm exec electron-builder \
            --mac dmg zip \
            --arm64 \
            --publish never

      - name: Verify artifacts
        run: |
          echo "=== Artifacts ==="
          ls -lh release/
          DMG=$(find release -name '*.dmg' | head -1)
          ZIP=$(find release -name '*.zip' | head -1)
          if [ -z "$DMG" ]; then echo "ERROR: DMG not found"; exit 1; fi
          if [ -z "$ZIP" ]; then echo "ERROR: ZIP not found"; exit 1; fi
          DMG_SIZE=$(stat -f%z "$DMG" 2>/dev/null || stat -c%s "$DMG" 2>/dev/null || echo 0)
          ZIP_SIZE=$(stat -f%z "$ZIP" 2>/dev/null || stat -c%s "$ZIP" 2>/dev/null || echo 0)
          if [ "$DMG_SIZE" -lt 10000000 ]; then echo "ERROR: DMG too small ($DMG_SIZE bytes, expected >10MB)"; exit 1; fi
          if [ "$ZIP_SIZE" -lt 10000000 ]; then echo "ERROR: ZIP too small ($ZIP_SIZE bytes, expected >10MB)"; exit 1; fi
          echo "✅ DMG: $DMG ($DMG_SIZE bytes)"
          echo "✅ ZIP: $ZIP ($ZIP_SIZE bytes)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: narwhal-mac-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: narwhal-mac-arm64
          path: artifacts

      - name: Display structure
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
